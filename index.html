<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator | Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <!-- Link to external CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="calculator" role="application" aria-label="Calculator">
        <!-- Header -->
        <div class="calc-header">
            <h1>Calculator</h1>
            <div class="badge">
                <span class="dot"></span>
                ready
            </div>
        </div>

        <!-- Display -->
        <div class="display" aria-live="polite" aria-atomic="true">
            <div class="expression" id="expression" aria-label="Expression"></div>
            <div class="result" id="result" aria-label="Result">0</div>
        </div>

        <!-- Buttons -->
        <div class="buttons" role="group" aria-label="Calculator buttons">
            <!-- Row 1 -->
            <button class="btn fn clear" data-action="clear-all" aria-label="Clear all">AC</button>
            <button class="btn fn" data-action="clear-entry" aria-label="Clear entry">CE</button>
            <button class="btn fn" data-action="percent" aria-label="Percent">%</button>
            <button class="btn op" data-action="divide" aria-label="Divide">÷</button>

            <!-- Row 2 -->
            <button class="btn" data-action="7">7</button>
            <button class="btn" data-action="8">8</button>
            <button class="btn" data-action="9">9</button>
            <button class="btn op" data-action="multiply" aria-label="Multiply">×</button>

            <!-- Row 3 -->
            <button class="btn" data-action="4">4</button>
            <button class="btn" data-action="5">5</button>
            <button class="btn" data-action="6">6</button>
            <button class="btn op" data-action="subtract" aria-label="Subtract">−</button>

            <!-- Row 4 -->
            <button class="btn" data-action="1">1</button>
            <button class="btn" data-action="2">2</button>
            <button class="btn" data-action="3">3</button>
            <button class="btn op" data-action="add" aria-label="Add">+</button>

            <!-- Row 5 -->
            <button class="btn" data-action="negate" aria-label="Negate">±</button>
            <button class="btn" data-action="0">0</button>
            <button class="btn" data-action="decimal" aria-label="Decimal point">.</button>
            <button class="btn eq" data-action="equals" aria-label="Equals">=</button>
        </div>

        <!-- Footer -->
        <div class="calc-footer">
            <span>⌨️ keyboard supported</span>
        </div>
    </div>

    <!-- Link to external JavaScript (defer ensures it runs after HTML loads) -->
    <script src="script.js" defer></script>
</body>
</html>
